<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1240 610" xmlns="http://www.w3.org/2000/svg">
<rect x="0" y="0" width="1240" height="610" fill="#fbfcfe"/>
<style>
  .box { fill:#ffffff; stroke:#3a5a9c; stroke-width:1.6; }
  .t { font-size:15px; font-weight:700; fill:#16305e; font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif; }
  .s { font-size:11.5px; fill:#44506a; font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif; }
  .e { font-size:11px; font-weight:700; fill:#1e7a5a; font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif; }
  .al { font-size:11px; fill:#3a5a9c; font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif; }
  text { font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif; }
</style>
<defs>
  <marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#3a5a9c"/></marker>
  <marker id="ahs" markerWidth="8" markerHeight="8" refX="1" refY="3" orient="auto-start-reverse"><path d="M0,0 L7,3 L0,6 Z" fill="#3a5a9c"/></marker>
</defs>

<!-- 研究者 -->
<rect class="box" x="30" y="40" width="180" height="64" rx="8"/>
<text x="120" y="68" text-anchor="middle" class="t">研究者</text>
<text x="120" y="88" text-anchor="middle" class="s">设定方向 · 审批 · 收排名</text>

<!-- 主 agent -->
<rect class="box" x="260" y="40" width="880" height="64" rx="8"/>
<text x="700" y="68" text-anchor="middle" class="t">主 agent</text>
<text x="700" y="88" text-anchor="middle" class="s">Supervisor · 调度 · 盘点 · 仲裁 · 假设池唯一写者</text>

<path d="M216,72 L254,72" stroke="#3a5a9c" stroke-width="1.8" fill="none" marker-end="url(#ah)"/>
<text x="235" y="60" text-anchor="middle" class="al">研究方向</text>

<!-- 派活 / 交回（双向） -->
<path d="M360,104 L360,244" stroke="#3a5a9c" stroke-width="1.6" fill="none" marker-start="url(#ahs)" marker-end="url(#ah)"/>
<path d="M600,104 L600,230" stroke="#3a5a9c" stroke-width="1.6" fill="none" marker-start="url(#ahs)" marker-end="url(#ah)"/>
<path d="M840,104 L840,244" stroke="#3a5a9c" stroke-width="1.6" fill="none" marker-start="url(#ahs)" marker-end="url(#ah)"/>
<path d="M1035,104 L1035,244" stroke="#3a5a9c" stroke-width="1.6" fill="none" marker-start="url(#ahs)" marker-end="url(#ah)"/>
<text x="368" y="180" class="al">派活 · 交回结论</text>

<!-- 生成 -->
<rect class="box" x="260" y="250" width="200" height="84" rx="8"/>
<text x="360" y="278" text-anchor="middle" class="t">生成 Generation</text>
<text x="360" y="298" text-anchor="middle" class="s">读反馈 · 笔记 · 经典库 · 查文献</text>
<text x="360" y="316" text-anchor="middle" class="e">subagent · 一次 ≤10 对</text>

<!-- 辩论（叠放示意并行） -->
<rect x="506" y="234" width="220" height="84" fill="#ffffff" stroke="#3a5a9c" stroke-width="1.2" rx="8"/>
<rect x="498" y="242" width="220" height="84" fill="#ffffff" stroke="#3a5a9c" stroke-width="1.2" rx="8"/>
<rect class="box" x="490" y="250" width="220" height="84" rx="8"/>
<text x="600" y="278" text-anchor="middle" class="t">辩论修改 Debate</text>
<text x="600" y="298" text-anchor="middle" class="s">质疑 / 辩护 · 立论 攻击 答辩 复核</text>
<text x="600" y="316" text-anchor="middle" class="e">每对一个单元 · 并行</text>

<!-- Rank -->
<rect class="box" x="750" y="250" width="180" height="84" rx="8"/>
<text x="840" y="278" text-anchor="middle" class="t">排序 Rank</text>
<text x="840" y="298" text-anchor="middle" class="s">逻辑 · 构造 · 新颖性打分</text>
<text x="840" y="316" text-anchor="middle" class="e">subagent · 只读池子</text>

<!-- 复盘 -->
<rect class="box" x="960" y="250" width="150" height="84" rx="8"/>
<text x="1035" y="278" text-anchor="middle" class="t">复盘</text>
<text x="1035" y="298" text-anchor="middle" class="s">Meta-review</text>
<text x="1035" y="316" text-anchor="middle" class="e">每轮收尾 · 定性反馈</text>

<!-- 站间流转 -->
<path d="M466,292 L484,292" stroke="#3a5a9c" stroke-width="1.8" fill="none" marker-end="url(#ah)"/>
<path d="M728,292 L744,292" stroke="#3a5a9c" stroke-width="1.8" fill="none" marker-end="url(#ah)"/>
<path d="M936,292 L954,292" stroke="#3a5a9c" stroke-width="1.8" fill="none" marker-end="url(#ah)"/>

<!-- 各站只读池子 -->
<path d="M360,334 L360,414" stroke="#3a5a9c" stroke-width="1.4" stroke-dasharray="2 3" fill="none" marker-end="url(#ah)"/>
<path d="M600,334 L600,414" stroke="#3a5a9c" stroke-width="1.4" stroke-dasharray="2 3" fill="none" marker-end="url(#ah)"/>
<path d="M840,334 L840,414" stroke="#3a5a9c" stroke-width="1.4" stroke-dasharray="2 3" fill="none" marker-end="url(#ah)"/>
<text x="268" y="382" class="al">各站只读</text>

<!-- 主 agent 唯一写入（右侧直下） -->
<path d="M1125,104 L1125,414" stroke="#3a5a9c" stroke-width="1.8" fill="none" marker-end="url(#ah)"/>
<text x="1117" y="385" text-anchor="end" class="al">唯一写入</text>

<!-- 回测（暂挂起） -->
<rect x="30" y="420" width="180" height="72" fill="#f4f4f6" stroke="#c9ccd6" stroke-dasharray="5 4" rx="8"/>
<text x="120" y="450" text-anchor="middle" class="t" style="font-size:13.5px; fill:#7a8199;">回测 Backtest</text>
<text x="120" y="472" text-anchor="middle" class="s" style="fill:#7a8199">暂挂起 · 后续再定</text>

<!-- 假设池 -->
<rect x="260" y="420" width="880" height="72" fill="#eef3fb" stroke="#3a5a9c" stroke-width="1.4" rx="10"/>
<text x="700" y="450" text-anchor="middle" class="t">假设池 Hypothesis Pool</text>
<text x="700" y="472" text-anchor="middle" class="s">编号 · 四项正文 · 状态 · Rank 分数 · 版本链 · 仅主 agent 可写 · 辩论记录另存 debate/</text>

<!-- 复盘 → 共享记忆（外侧绕行） -->
<path d="M1116,292 L1158,292 L1158,544 L1146,544" stroke="#3a5a9c" stroke-width="1.6" fill="none" marker-end="url(#ah)"/>
<text x="1150" y="270" text-anchor="end" class="al">追加反馈</text>

<!-- 共享记忆 -->
<rect x="260" y="520" width="880" height="48" fill="#ffffff" stroke="#3a5a9c" stroke-width="1.2" rx="10"/>
<text x="700" y="549" text-anchor="middle" style="font-size:12.5px; fill:#16305e;">共享记忆 Shared Memory（全员必读）：研究计划 · 试验登记 · 运行统计（主 agent 记） · Meta-review 反馈（复盘追加）</text>
</svg>

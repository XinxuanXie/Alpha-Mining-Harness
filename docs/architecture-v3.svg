<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1160 700" xmlns="http://www.w3.org/2000/svg">
<rect x="0" y="0" width="1160" height="700" fill="#fbfcfe"/>
<style>
  .box { fill: #ffffff; stroke: #3a5a9c; stroke-width: 1.6; }
  .box-title { font-size: 15px; font-weight: 700; fill: #16305e; font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }
  .box-sub { font-size: 11.5px; fill: #44506a; font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }
  .box-exec { font-size: 11px; font-weight: 700; fill: #1e7a5a; font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }
  .zone-label { font-size: 12px; font-weight: 700; fill: #8a93a8; letter-spacing: 2px; font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }
  .arrow { stroke: #3a5a9c; stroke-width: 1.8; fill: none; }
  .arrow-label { font-size: 11px; fill: #3a5a9c; font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }
  text { font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }
</style>
  <defs>
    <marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#3a5a9c"/></marker>
    <marker id="ah-start" markerWidth="8" markerHeight="8" refX="1" refY="3" orient="auto-start-reverse"><path d="M0,0 L7,3 L0,6 Z" fill="#7a8199"/></marker>
    <marker id="ah-grey" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#7a8199"/></marker>
  </defs>

  <text x="480" y="84" text-anchor="middle" class="zone-label">围着假设池持续运转</text>

  <!-- 研究者 -->
  <rect class="box" x="20" y="100" width="130" height="64" rx="8"/>
  <text x="85" y="130" text-anchor="middle" class="box-title">研究者</text>
  <text x="85" y="150" text-anchor="middle" class="box-sub">设定方向 · 审批</text>

  <!-- 主 agent -->
  <rect class="box" x="300" y="100" width="300" height="64" rx="8"/>
  <text x="450" y="130" text-anchor="middle" class="box-title">主 agent</text>
  <text x="450" y="150" text-anchor="middle" class="box-sub">Supervisor · 调度 · 盘点 · 仲裁</text>

  <path class="arrow" d="M150,132 L294,132" marker-end="url(#ah)"/>
  <text x="222" y="120" text-anchor="middle" class="arrow-label">研究方向</text>

  <!-- Meta-review -->
  <rect x="680" y="100" width="280" height="64" fill="#fff" stroke="#c0392b" stroke-width="1.6" stroke-dasharray="7 4" rx="8"/>
  <text x="820" y="130" text-anchor="middle" class="box-title" style="fill:#8e2f24;">Meta-review（每轮复盘）</text>
  <text x="820" y="150" text-anchor="middle" class="box-exec">独立 subagent · 每轮收尾触发</text>

  <!-- 派活 -->
  <path class="arrow" d="M400,164 L297,249" marker-end="url(#ah)"/>
  <text x="330" y="200" text-anchor="middle" class="arrow-label">派活</text>

  <!-- 资源：文献笔记 -->
  <rect class="box" x="15" y="244" width="140" height="52" rx="8" style="stroke:#7a8199"/>
  <text x="85" y="268" text-anchor="middle" class="box-title" style="font-size:13.5px;">文献笔记</text>
  <text x="85" y="286" text-anchor="middle" class="box-sub">生成写 · Literature Notes</text>

  <!-- 资源：经典库 -->
  <rect class="box" x="15" y="372" width="140" height="52" rx="8" style="stroke:#7a8199"/>
  <text x="85" y="396" text-anchor="middle" class="box-title" style="font-size:13.5px;">经典库</text>
  <text x="85" y="414" text-anchor="middle" class="box-sub">全员只读 · Classic Library</text>

  <path d="M155,270 L179,270" stroke="#7a8199" stroke-width="1.8" fill="none" marker-start="url(#ah-start)" marker-end="url(#ah-grey)"/>

  <!-- 资源：文献检索 -->
  <rect class="box" x="15" y="308" width="140" height="52" rx="8" style="stroke:#7a8199"/>
  <text x="85" y="332" text-anchor="middle" class="box-title" style="font-size:13.5px;">文献检索</text>
  <text x="85" y="350" text-anchor="middle" class="box-sub">Literature Search</text>

  <path class="arrow" d="M155,334 L181,318" style="stroke:#7a8199" marker-end="url(#ah-grey)"/>
  <path class="arrow" d="M155,382 L188,328" style="stroke:#7a8199" marker-end="url(#ah-grey)"/>

  <!-- 生成 -->
  <rect class="box" x="185" y="250" width="200" height="76" rx="8"/>
  <text x="285" y="278" text-anchor="middle" class="box-title">生成 Generation</text>
  <text x="285" y="297" text-anchor="middle" class="box-sub">读反馈·笔记·池子 · 查文献 · 翻经典库</text>
  <text x="285" y="315" text-anchor="middle" class="box-exec">subagent</text>

  <!-- 辩论修改（叠放示意多单元并行） -->
  <rect x="486" y="234" width="210" height="76" fill="#ffffff" stroke="#3a5a9c" stroke-width="1.2" rx="8"/>
  <rect x="478" y="242" width="210" height="76" fill="#ffffff" stroke="#3a5a9c" stroke-width="1.2" rx="8"/>
  <rect class="box" x="470" y="250" width="210" height="76" rx="8"/>
  <text x="575" y="278" text-anchor="middle" class="box-title">辩论修改 Debate &amp; Revise</text>
  <text x="575" y="297" text-anchor="middle" class="box-sub">质疑 / 辩护两个 subagent · 全面质疑假设与构造</text>
  <text x="575" y="315" text-anchor="middle" class="box-exec">subagent · 每对一个单元 · 并行</text>

  <!-- 排序 -->
  <rect class="box" x="770" y="250" width="210" height="76" rx="8"/>
  <text x="875" y="278" text-anchor="middle" class="box-title">排序 Rank</text>
  <text x="875" y="297" text-anchor="middle" class="box-sub">逻辑 · 构造 · 新颖性打分，即排名</text>
  <text x="875" y="315" text-anchor="middle" class="box-exec">subagent · 只读池子</text>

  <path class="arrow" d="M385,288 L464,288" marker-end="url(#ah)"/>
  <path class="arrow" d="M680,288 L764,288" marker-end="url(#ah)"/>

  <!-- 仲裁 -->
  <path d="M575,232 L575,170" stroke="#3a5a9c" stroke-width="1.6" stroke-dasharray="5 4" fill="none" marker-end="url(#ah)"/>
  <text x="586" y="215" style="font-size:11px; fill:#3a5a9c;">分歧仲裁</text>

  <!-- 主 agent 对假设池的唯一写入 -->
  <path class="arrow" d="M600,140 L640,140 L640,494" marker-end="url(#ah)"/>
  <text x="648" y="345" class="arrow-label">唯一写入</text>

  <!-- 假设池 -->
  <rect x="185" y="500" width="795" height="78" fill="#eef3fb" stroke="#3a5a9c" stroke-width="1.4" rx="10"/>
  <text x="582" y="532" text-anchor="middle" class="box-title" style="font-size:14px;">假设池 Hypothesis Pool</text>
  <text x="582" y="556" text-anchor="middle" style="font-size:12px; fill:#44506a;">每条对子一份档案：编号 · 四项正文 · 状态 · Rank 分数 · 版本链；辩论全程记录另存 debate/ 按编号引用</text>

  <path d="M285,326 L285,497" stroke="#3a5a9c" stroke-width="1.2" stroke-dasharray="2 3" fill="none" marker-end="url(#ah)"/>
  <path d="M575,326 L575,497" stroke="#3a5a9c" stroke-width="1.2" stroke-dasharray="2 3" fill="none" marker-end="url(#ah)"/>
  <path d="M875,326 L875,497" stroke="#3a5a9c" stroke-width="1.2" stroke-dasharray="2 3" fill="none" marker-end="url(#ah)"/>
  <text x="293" y="420" class="arrow-label">读</text>
  <text x="583" y="420" class="arrow-label">读</text>
  <text x="883" y="420" class="arrow-label">读</text>

  <!-- 回测（暂挂起） -->
  <rect x="1000" y="500" width="145" height="78" fill="#f4f4f6" stroke="#c9ccd6" stroke-dasharray="5 4" rx="10"/>
  <text x="1072" y="532" text-anchor="middle" class="box-title" style="font-size:13.5px; fill:#7a8199;">回测</text>
  <text x="1072" y="556" text-anchor="middle" style="font-size:11.5px; fill:#7a8199;">暂挂起 · 后续再定</text>

  <!-- 共享记忆 -->
  <rect x="185" y="600" width="795" height="46" fill="#ffffff" stroke="#3a5a9c" stroke-width="1.2" rx="10"/>
  <text x="582" y="628" text-anchor="middle" style="font-size:12.5px; fill:#16305e;">共享记忆（全局共享，所有 agent 必读）：研究计划 · 试验登记 · 运行统计 · Meta-review 反馈</text>
</svg>
